<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treasure Kingdom</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2A1F5C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#CFEBFF;--card:#FFFFFF;--cell:#EAF6FF;--trail:#FF8A5B;--dot:#FFD23F;--done:#4CC38A;--ink:#3B2A5C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F2547;--card:#2C3363;--cell:#3B4380;--ink:#FFF4D6}}
:root[data-theme="dark"]{--bg:#1F2547;--card:#2C3363;--cell:#3B4380;--ink:#FFF4D6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",sans-serif;
display:flex;justify-content:center;padding:18px 14px;user-select:none;-webkit-user-select:none}
section{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
h1{margin:0;font-size:2.2rem;font-weight:700}
p{margin:0;font-size:1.15rem;text-align:center;max-width:22em}
#stars{font-size:1.8rem;letter-spacing:.2em;min-height:2.2rem}
#board{position:relative;width:min(92vw,420px);aspect-ratio:1;background:var(--card);border-radius:28px;padding:10px;touch-action:none;box-shadow:0 6px 0 rgba(59,42,92,.18)}
#grid{position:absolute;inset:10px;display:grid;gap:6px}
.cell{background:var(--cell);border-radius:18px;transition:background .15s}
.cell.on{background:#FFE3D6}
.layer{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);pointer-events:none}
#head{z-index:3}
.dot{position:absolute;display:grid;place-items:center;border-radius:50%;background:var(--dot);color:#3B2A5C;font-weight:700;pointer-events:none;transform:translate(-50%,-50%);transition:background .2s}
.dot.hit{background:var(--done);color:#fff}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
button{font:inherit;font-weight:700;font-size:1.2rem;border:0;border-radius:999px;padding:12px 24px;background:var(--trail);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(59,42,92,.25)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(59,42,92,.25)}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.big{display:flex;flex-direction:column;align-items:center;gap:2px;width:min(80vw,280px);padding:18px;font-size:1.6rem;border-radius:36px}
.big span{font-size:4.2rem;line-height:1.1}
.big[data-t=big]{background:var(--done)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row button{font-size:1.05rem;padding:10px 18px}
.row .alt{background:var(--ink);color:var(--bg)}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(207,235,255,.88);z-index:5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #win{background:rgba(31,37,71,.9)}}
:root[data-theme="dark"] #win{background:rgba(31,37,71,.9)}
#win.show{display:flex}
#win h2{margin:0;font-size:3rem}
.pop{position:fixed;top:-40px;font-size:2rem;animation:fall linear forwards;pointer-events:none;z-index:6}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s!important}.cell{transition:none}}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:4;padding:8px 14px;font-size:1.1rem}
button.alt,#mute{background:var(--ink);color:var(--bg)}
.big[data-g=shapes]{background:var(--dot);color:#3B2A5C}
.big[data-g=dots]{background:var(--trail)}
#stars2{font-size:1.8rem;letter-spacing:.2em;min-height:2.2rem}
#targets,#tray{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%}
#tray{margin-top:26px;min-height:calc(var(--sz,100px) + 10px)}
.slot,.piece{width:var(--sz,100px);height:var(--sz,100px);color:var(--ink)}
.slot{background:var(--card);border-radius:22px;padding:8px;box-shadow:0 4px 0 rgba(59,42,92,.15)}
.piece{touch-action:none;cursor:grab;position:relative;filter:drop-shadow(0 4px 0 rgba(59,42,92,.2))}
.piece svg{pointer-events:none}
#menu .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(92vw,420px)}
.big.gm{width:100%;font-size:1.25rem;padding:14px 8px;border-radius:28px}
.big.gm span{font-size:3rem}
.big[data-g=sort]{background:#4DA3FF}
.big[data-g=count]{background:#FF8FD0;color:#3B2A5C}
.slot.bk{background:var(--c);height:calc(var(--sz,100px)*1.25);display:flex;flex-direction:column;align-items:center;padding:6px;color:#fff}
.bl{font-size:1.15rem;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.in{display:flex;flex-wrap:wrap;justify-content:center;font-size:1.4rem;line-height:1.1}
.piece.em{display:grid;place-items:center;font-size:calc(var(--psz,70px)*.75);line-height:1;filter:none;width:var(--psz,70px);height:var(--psz,70px)}
#cstars{font-size:1.8rem;letter-spacing:.2em;min-height:2.2rem}
#cbox{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:center;background:var(--card);border-radius:28px;padding:16px;width:min(92vw,420px);min-height:170px;box-shadow:0 6px 0 rgba(59,42,92,.18)}
.ci{background:none;box-shadow:none;color:inherit;padding:2px 6px;line-height:1.1;border-radius:16px;transition:opacity .2s,transform .2s}
.ci.on{opacity:.35;transform:scale(.85)}
#cans button{min-width:84px;font-size:2.2rem;background:var(--dot);color:#3B2A5C;padding:10px 20px}
#cans button.no{opacity:.3}
#cans button.yes{background:var(--done);color:#fff}
#vw{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--bg);border-radius:20px;padding:12px 16px;font-size:1rem;text-align:center}
.big[data-g=quest]{grid-column:1/-1;background:#8E5CF0;color:#fff}
#qart{font-size:3.4rem;line-height:1.15;text-align:center;background:var(--card);border-radius:28px;padding:20px 14px;width:min(92vw,420px);box-shadow:0 6px 0 rgba(59,42,92,.18);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){#qart{animation:none}}
#qtext{font-size:1.35rem;max-width:20em}
#qopts{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(92vw,420px)}
#qopts .big{width:100%}
.go{grid-column:1/-1;font-size:2rem;padding:16px;background:var(--done)}
#stage{position:relative;overflow:hidden;width:min(92vw,420px);aspect-ratio:1/1.05;border-radius:28px;background:linear-gradient(var(--sky,#BFE6FF) 0 62%,var(--gnd,#8FD694) 62% 100%);box-shadow:0 6px 0 rgba(59,42,92,.18)}
#deco{position:absolute;left:0;right:0;bottom:36%;display:flex;justify-content:space-around;font-size:3rem;opacity:.85;pointer-events:none}
.sp{position:absolute;bottom:24%;font-size:3.4rem;line-height:1;transform:translateX(-50%)}
.sp.walk{animation:step .35s ease-in-out infinite}
@keyframes step{50%{transform:translateX(-50%) translateY(-10px)}}
.sp.jump{animation:jump .6s ease 2}
@keyframes jump{50%{transform:translateX(-50%) translateY(-34px) scale(1.12)}}
.sp.dance{animation:dance .45s ease 4}
@keyframes dance{25%{transform:translateX(-50%) rotate(-14deg)}75%{transform:translateX(-50%) rotate(14deg)}}
.bub{position:absolute;bottom:calc(24% + 4.4rem);transform:translateX(-50%);background:#fff;color:#3B2A5C;border-radius:18px;padding:8px 12px;font-size:1.05rem;max-width:62%;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#cap{font-size:1.25rem;min-height:3.2rem;max-width:20em;text-align:center}
@media (prefers-reduced-motion:reduce){.sp.walk,.sp.jump,.sp.dance{animation:none}}
#fbox{width:min(92vw,420px);background:var(--card);border-radius:28px;padding:14px;box-shadow:0 6px 0 rgba(59,42,92,.18);display:flex;flex-direction:column;align-items:center;gap:10px}
#fmon{font-size:5.5rem;line-height:1;transition:font-size .4s}
#fmon.chomp{animation:chomp .4s}
@keyframes chomp{40%{transform:scale(1.25,.8)}}
#fgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:130px}
.fr{position:relative;background:none;box-shadow:none;color:inherit;padding:4px;font-size:3.2rem;line-height:1;transition:transform .5s,opacity .5s}
.fr b{position:absolute;right:-2px;bottom:-2px;background:var(--dot);color:#3B2A5C;border-radius:50%;width:1.7rem;height:1.7rem;font-size:1.1rem;display:grid;place-items:center}
.fr.no,.bl2.no{animation:sh .3s}
#bbox{position:relative;overflow:hidden;width:min(92vw,420px);aspect-ratio:1/1.05;border-radius:28px;background:linear-gradient(#BFE6FF 0 56%,#FF9A3D 56%,#D63A22 100%);box-shadow:0 6px 0 rgba(59,42,92,.18)}
.bk2{position:absolute;bottom:0;width:15%;height:44%;background:#8B5E3C;border-top:8px solid #6BBF59}
#bfire{position:absolute;left:15%;right:15%;bottom:4%;display:flex;justify-content:space-around;font-size:2rem;animation:flick 1s ease-in-out infinite alternate}
@keyframes flick{to{transform:translateY(-6px) scale(1.1)}}
.h2,.stone{position:absolute;transform:translateX(-50%);line-height:1}
.h2{bottom:44%;font-size:3.2rem;transition:left .6s ease;z-index:2}
.h2.hopy{animation:hopy .6s}
@keyframes hopy{50%{margin-bottom:46px}}
.stone{bottom:34%;font-size:3.2rem;animation:dropin .5s}
@keyframes dropin{from{transform:translate(-50%,-160px);opacity:0}}
.bl2{position:absolute;width:56px;height:68px;border-radius:50% 50% 48% 48%;border:0;font-size:1.6rem;color:#fff;box-shadow:inset -6px -6px 0 rgba(0,0,0,.12);animation:bobb 2.4s ease-in-out infinite;transition:opacity .25s,transform .25s;padding:0}
.bl2::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:22px;background:rgba(59,42,92,.5)}
.bl2.burst{opacity:0;transform:scale(1.6)}
@keyframes bobb{50%{margin-top:-8px}}
/* retro */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#2A1F5C;--card:#FFF4D6;--cell:#FFE3A0;--ink:#2B1D4A;--trail:#FF5C3A;--dot:#FFD23F;--done:#3FD07A}
body{color:#FFF4D6;background:conic-gradient(#2A1F5C 25%,#33266B 0 50%,#2A1F5C 0 75%,#33266B 0) 0 0/40px 40px;font-family:"Pixelify Sans","Courier New",monospace}
h1{text-shadow:4px 4px 0 #000;letter-spacing:1px}
#board,#fbox,#cbox,#qart,#stage,#bbox,#map,.slot,.bub{border-radius:0;border:4px solid #2B1D4A;box-shadow:6px 6px 0 #000;color:var(--ink)}
button{border-radius:0;border:4px solid #2B1D4A;box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.35),4px 4px 0 #000}
.ci,.fr{border:0;box-shadow:none}
.cell{border-radius:0;box-shadow:inset -3px -3px 0 rgba(0,0,0,.12)}
.dot{border-radius:0;border:4px solid #2B1D4A}
.piece svg,.slot svg{shape-rendering:crispEdges}
#stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 3px,rgba(0,0,0,.07) 3px 4px);pointer-events:none;z-index:5}
:root:not([data-theme="light"]) #win,:root[data-theme="dark"] #win,#win{background:rgba(42,31,92,.93)}
.px{width:1.15em;height:1.15em;image-rendering:pixelated;vertical-align:-.2em;pointer-events:none}
#map{position:relative;width:min(92vw,420px);aspect-ratio:1/.8;overflow:hidden;background:conic-gradient(#68C768 25%,#5BB85B 0 50%,#68C768 0 75%,#5BB85B 0) 0 0/32px 32px}
.mpath{position:absolute;inset:0;width:100%;height:100%}
.mn{position:absolute;transform:translate(-50%,-50%);font-size:2rem;line-height:1;background:#FFF4D6;border:4px solid #2B1D4A;padding:4px;box-shadow:3px 3px 0 #000}
.mn.done{background:#B6F3C4}
.mn.now{animation:blink .8s steps(2) infinite}
@keyframes blink{50%{background:#FFD23F}}
.mn b{position:absolute;right:-12px;top:-14px;font-size:1.1rem}
.mh{position:absolute;font-size:2.6rem;line-height:1;transform:translate(-50%,-75%);transition:left 1.5s linear,top 1.5s linear;z-index:2}
.mh.walk{animation:mstep .35s infinite}
@keyframes mstep{50%{margin-top:-8px}}
#title{justify-content:center;min-height:80vh;gap:24px}
#title h1{font-size:2.6rem;text-align:center;line-height:1.15}
#tspr{font-size:3.2rem;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;animation:bob 2.4s ease-in-out infinite}
#start{font-size:2.4rem;padding:18px 40px;animation:blink2 1s steps(2) infinite}
@keyframes blink2{50%{filter:brightness(1.3)}}
.dot,.fr b,.bl2,#cans button{font-family:"Fredoka","Trebuchet MS",Arial,sans-serif;font-weight:700}
.dot{text-shadow:0 2px 0 rgba(255,255,255,.45)}
.fr b{width:2rem;height:2rem;font-size:1.3rem}
.bl2{width:64px;height:78px;font-size:2.1rem;text-shadow:0 2px 0 rgba(0,0,0,.3)}
#cans button{font-size:2.6rem}
/* skins */
#board{background:#3F8A55}
.cell{background:#6FBF5E;display:grid;place-items:center}
.cell.on{background:#C79A62}
.cell .px{width:74%;height:74%;margin:auto;display:block;vertical-align:top}
.cell.on .px{visibility:hidden}
#shapes.market,#shapes.cave{width:min(96vw,440px);padding:14px;border:4px solid #2B1D4A;box-shadow:6px 6px 0 #000;gap:12px}
#shapes.market{background:#E9B872 repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 3px,transparent 3px 18px)}
#shapes.cave{background:radial-gradient(circle,#5A4A7A 0 5px,transparent 6px) 0 0/44px 44px,#3F3360}
#shapes.market p,#shapes.market #stars2{color:#2B1D4A}
.awning{display:none;height:30px;width:calc(100% + 28px);margin:-14px -14px 0;background:repeating-linear-gradient(90deg,#E8484F 0 28px,#FFF 28px 56px);border-bottom:4px solid #2B1D4A}
#shapes.market .awning{display:block}
#shapes.market .slot{background:#C98B4A;border:4px solid #7A4A22}
#shapes.market #tray{background:#8A5A2B;border:4px solid #5A3A1B;padding:12px}
#shapes.cave .slot.bk{background:#6B5A48;border:4px solid #2B1D4A;border-top:16px solid var(--c);border-radius:0 0 18px 18px;position:relative;margin-bottom:16px}
#shapes.cave .slot.bk::after{content:"";position:absolute;left:12%;right:12%;bottom:-18px;height:16px;background:radial-gradient(circle at 18% 50%,#2B1D4A 0 8px,transparent 9px),radial-gradient(circle at 82% 50%,#2B1D4A 0 8px,transparent 9px)}
#shapes.cave #targets{border-bottom:6px dashed #8B7355;padding-bottom:6px}
#fbox{background:linear-gradient(#9FD3B5 0 50%,#4F9A64 50%)}
#cbox{display:block;position:relative;height:250px;overflow:hidden;padding:0}
#cbox.sky{background:#7FC8FF}
#cbox.sky::before{content:"";position:absolute;left:12%;top:22%;width:76%;height:54%;background:#fff;border-radius:60px;box-shadow:-26px 14px 0 -6px #fff,34px -22px 0 -4px #fff,-10px -28px 0 -2px #fff}
#cbox.field{background:linear-gradient(#BFE6FF 0 35%,#6BBF59 35%)}
#cbox.floor{background:#4A3B30 radial-gradient(circle,#5C4A3C 0 5px,transparent 6px) 0 0/36px 36px}
.ci{position:absolute;transform:translate(-50%,-50%);z-index:1}
.ci.on{opacity:.35;transform:translate(-50%,-50%) scale(.85)}
#mgrid{display:grid;gap:10px;width:min(92vw,420px)}
.mc{position:relative;aspect-ratio:1;background:#8B5E3C;border:4px solid #2B1D4A;padding:0;display:grid;place-items:center}
.mc::before{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-size:2.6rem;color:#FFF4D6;font-family:"Fredoka",sans-serif}
.mc.up::before,.mc.ok::before{content:none}
.mc .mf{visibility:hidden;font-size:3rem;line-height:1}
.mc.up .mf{visibility:visible}
.mc.up{background:#FFF4D6}
.mc.ok{background:#B6F3C4}
.ck{color:#3FD07A;margin-left:6px}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:10px;z-index:4;display:flex;gap:10px;align-items:center;background:#2B1D4A;border:3px solid #FFF4D6;padding:4px 10px;font-size:1rem}
#chances{color:#FFD23F;letter-spacing:2px}
#lose{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(42,31,92,.93);z-index:8;text-align:center;padding:20px}
#lose.show{display:flex}
#lose h2{margin:0;font-size:3rem}
#lm{font-size:1.3rem;max-width:18em}
#gain{font-size:2.4rem;color:#FFD23F}
#credits{position:fixed;inset:0;z-index:9;overflow:auto;background:#140F33;text-align:center;padding-bottom:120px}
#crl{margin-top:100vh;animation:crup 14s ease-out forwards}
@keyframes crup{to{margin-top:3vh}}
#crl h2{font-size:3rem;margin:12px 0}
#crl p{font-size:1.3rem;color:#FFD23F;margin:18px 0 6px}
.cr{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0}
.cr b{font-size:1.4rem}
.cs{display:inline-block;font-size:3.6rem;animation:cdance .5s steps(2) infinite}
@keyframes cdance{0%{transform:translateY(0) rotate(-8deg)}100%{transform:translateY(-10px) rotate(8deg)}}
.big2{font-size:2.4rem}
#crb{position:fixed;left:0;right:0;bottom:16px;display:flex;gap:12px;justify-content:center;z-index:10}
@keyframes floaty{50%{margin-bottom:10px}}
.sp.fly{animation:floaty 1.6s ease-in-out infinite}
#map{aspect-ratio:1/.95;background:conic-gradient(#5FA8DD 25%,#6BB6E8 0 50%,#5FA8DD 0 75%,#6BB6E8 0) 0 0/28px 28px;border:8px solid #C9A468;outline:4px solid #2B1D4A;box-shadow:inset 0 0 0 4px #2B1D4A,6px 6px 0 #000}
.land{position:absolute;background:#6BBF59;border:4px solid #3E8E48;border-radius:46% 54% 50% 50%/50% 46% 54% 50%;box-shadow:inset -10px -10px 0 rgba(0,0,0,.1)}
.mdec{position:absolute;transform:translate(-50%,-50%);font-size:1.9rem;line-height:1}
.mtitle{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#8B2E2E;color:#FFF4D6;border:4px solid #2B1D4A;padding:2px 14px;font-size:1rem;letter-spacing:2px;white-space:nowrap;z-index:3}
.big[data-t=hard]{background:#8E5CF0;color:#fff}
#pgrid{display:grid;gap:2px;width:min(86vw,340px);aspect-ratio:1;background:#2B1D4A;border:4px solid #2B1D4A}
.ps{background:rgba(255,255,255,.18);border:2px dashed rgba(255,255,255,.45)}
.ps.full{border:0;image-rendering:pixelated}
#ptray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(92vw,420px);min-height:70px}
.pp{width:var(--pz,76px);height:var(--pz,76px);touch-action:none;cursor:grab;border:3px solid #FFF4D6;image-rendering:pixelated;position:relative}
#castle{width:min(84vw,380px);image-rendering:pixelated;border:4px solid #2B1D4A;box-shadow:6px 6px 0 #000}
#title h1{font-size:2.8rem}
</style>
</head>
<body>
<button id="mute" aria-label="Sound is on">🔊</button>
<div id="vw" hidden></div>

<script>
const snake=n=>{const p=[];for(let r=0;r<n;r++)for(let k=0;k<n;k++)p.push([r,r%2?n-1-k:k]);return p};
const T=p=>p.map(([r,c])=>[c,r]);
const spiral=n=>{const p=[];let t=0,b=n-1,l=0,R=n-1;while(t<=b&&l<=R){for(let c=l;c<=R;c++)p.push([t,c]);t++;for(let r=t;r<=b;r++)p.push([r,R]);R--;

const TRACKS={

{n:2,p:snake(2),w:[0,3],lab:'num'},
{n:3,p:snake(3),w:[0,4,8],lab:'num'},
{n:3,p:spiral(3),w:[0,5,8],lab:'num'},
{n:3,p:T(snake(3)),w:[0,4,8],lab:'num'}],
big:[
{n:4,p:T(snake(4)),w:[0,5,10,15],lab:'num'},
{n:4,p:spiral(4),w:[0,6,11,15],lab:'num'},
{n:5,p:snake(5),w:[0,6,12,18,24],lab:'abc'},
{n:5,p:spiral(5),w:[0,8,16,20,24],lab:'abc'}],hard:[{n:5,p:snake(5),w:[0,4,9,14,19,24],lab:'num'},{n:6,p:spiral(6),w:[0,8,15,22,29,35],lab:'num'}]};
const TIPS={hard:'Connect the numbers in order! Fill every square.',little:'Connect the numbers in order: 1, 2, 3! Fill every square.',big:'Help the fox visit each dot in order. Fill every square!'};
const $=id=>document.getElementById(id);
const board=$('board'),grid=$('grid'),trail=$('trail'),head=$('head');
let track,lv=0,cur,n,wp,total,path=[],drag=false,done=false,hint=null,ac,mode='dots';
let muted=false;
function tone(f,d=.18,type='sine',v=.08,delay=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();if(muted)return;
const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);

const sfx={

dot:()=>{tone(784,.15);tone(1047,.25,'sine',.08,.1)},
back:()=>tone(260,.1,'triangle'),
bad:()=>tone(150,.25,'sawtooth',.05),

win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'sine',.08,i*.14))};
const SAY={'🍎':'apple','🌞':'sun','🐟':'fish','🍓':'strawberry','🐸':'frog','⭐':'star','🍌':'banana','🐢':'turtle','🌈':'rainbow'};
let VO=null;

function say(t,f){if(muted||!t||!('speechSynthesis' in window))return;if(!f&&!/^([A-Za-z0-9]{1,2}|red|blue|green|yellow|circle|square|triangle|star|heart|diamond|hexagon|coin)$/i.test(String(t).trim()))return;try{speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(String(t));u.lang='en-US';if(VO)u.voice=VO;u.rate=.8;u.pitch=1.3;u.volume=1;u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted')warnVoice()};duck(String(t).length*80+1200);speechSynthesis.speak(u);setTimeout(()=>{if(!speechSynthesis.getVoices().length)warnVoice()},1500)}catch(e){warnVoice()}}

const label=k=>cur.lab==='num'?k:cur.lab==='abc'?String.fromCharCode(64+k):cur.lab[k-1];

function load(i){
lv=i;cur=TRACKS[track][i];n=cur.n;wp={};done=false;path=[];hint=null;
cur.w.forEach((idx,k)=>{const[r,c]=cur.p[idx];wp[r*n+c]=k+1});

d.style.cssText=`left:calc(10px + (100% - 20px) * ${(c+.5)/n});top:calc(10px + (100% - 20px) * ${(r+.5)/n});width:${s*1.3}%;height:${s*1.3}%;font-size:${track==='little'?(n>2?2.8:3.4):(n>4?1.9:2.4)}rem`;

function visited(){return path.filter(([r,c])=>wp[r*n+c]).length}
function draw(){
const cells=grid.children,u=100;
for(let k=0;k<cells.length;k++)cells[k].classList.remove('on');
path.forEach(([r,c])=>cells[r*n+c].classList.add('on'));

path.forEach(([r,c])=>{const d=$('d'+(r*n+c));if(d)d.classList.add('hit')});

const pts=path.map(([r,c])=>`${c*u+u/2},${r*u+u/2}`).join(' ');
trail.innerHTML=path.length>1?`<polyline points="${pts}" fill="none" stroke="#A8763E" stroke-width="${n>3?28:34}" stroke-linecap="square" stroke-linejoin="miter" opacity=".9"/>`:'';
let h='';
if(hint)h+=`<circle cx="${hint[1]*u+u/2}" cy="${hint[0]*u+u/2}" r="34" fill="none" stroke="var(--done)" stroke-width="8"><animate attributeName="r" values="28;44;28" dur="1s" repeatCount="indefinite"/></circle>`;
const[r,c]=path.length?path[path.length-1]:cur.p[0];
h+=`<image href="${pxURL(Q?qh:'👸')}" x="${c*u+u/2-(n>3?26:32)}" y="${r*u+u/2-(n>3?26:32)}" width="${n>3?52:64}" height="${n>3?52:64}" style="image-rendering:pixelated"/>`;
head.innerHTML=h;
$('stars').textContent='⭐'.repeat(visited())+'☆'.repeat(total-visited());
}
const same=(a,b)=>a[0]===b[0]&&a[1]===b[1];
function cellAt(e){
const b=grid.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
if(x<0||y<0||x>=b.width||y>=b.height)return null;
return[Math.floor(y/b.height*n),Math.floor(x/b.width*n)];
}
function enter(cell){
if(!cell||done)return;
const[r,c]=cell,key=r*n+c;
if(!path.length){if(same(cell,cur.p[0])){path.push(cell);hint=null;sfx.dot();say(spoken(1));draw()}return}
const last=path[path.length-1];
if(same(last,cell))return;
if(path.length>1&&same(path[path.length-2],cell)){path.pop();sfx.back();draw();return}
if(Math.abs(last[0]-r)+Math.abs(last[1]-c)!==1||path.some(p=>same(p,cell)))return;
if(wp[key]&&wp[key]!==visited()+1){board.classList.remove('shake');void board.offsetWidth;board.classList.add('shake');track!=='little'?sfx.bad():sfx.back();say(spoken(visited()+1));miss();return}
path.push(cell);hint=null;if(wp[key]){sfx.dot();say(spoken(wp[key]))}else sfx.step();draw();
if(path.length===n*n)win();
}
board.addEventListener('pointerdown',e=>{
if(done)return;const cell=cellAt(e);if(!cell)return;
board.setPointerCapture(e.pointerId);drag=true;{const wk=wp[cell[0]*n+cell[1]];if(wk)say(spoken(wk))}
const i=path.findIndex(p=>same(p,cell));
if(i>=0&&path.length>1){path=path.slice(0,i+1);draw()}else enter(cell);
});
board.addEventListener('pointermove',e=>{if(drag)enter(cellAt(e))});
['pointerup','pointercancel'].forEach(t=>board.addEventListener(t,()=>drag=false));
function win(){
done=true;drag=false;sfx.win();setTimeout(()=>say('Hooray! You did it!'),700);
$('next').textContent=lv===TRACKS[track].length-1?'Home':'Next';
setTimeout(()=>{if(Q){$('next').textContent='Next';const gn=Math.max(1,3-mist);STARS+=gn;$('gain').textContent='+'+gn+' ⭐';updHud()}$('win').classList.add('show');autoGo('next','win',10);
const e=['⭐','🎈','🌈','🦋','🌸','👸'];
for(let i=0;i<22;i++){const s=document.createElement('span');s.className='pop';s.textContent=e[i%e.length];
s.style.left=Math.random()*95+'vw';s.style.animationDuration=(2+Math.random()*2)+'s';s.style.animationDelay=Math.random()*.6+'s';
document.body.appendChild(s);setTimeout(()=>s.remove(),5000)}},500);
}
$('next').onclick=()=>{$('win').classList.remove('show');if(Q)return questNext();if(mode!=='dots')return shapesNext();lv===TRACKS[track].length-1?home():load(lv+1)};
$('reset').onclick=()=>load(lv);
$('home-btn').onclick=home;
$('hint').onclick=()=>{let m=0;while(m<path.length&&same(path[m],cur.p[m]))m++;path=path.slice(0,m);hint=cur.p[m]||null;draw()};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';$('mute').setAttribute('aria-label',muted?'Sound is off':'Sound is on');if(muted)try{speechSynthesis.cancel()}catch(e){}};
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{sfx.tap();if(b.id!=='mute'&&b.id!=='test')say(b.textContent.replace(/[^A-Za-z0-9\- ]/g,'').replace('2-3','2 to 3').replace('4-6','4 to 6').replace('7-9','7 to 9').trim())}));
document.addEventListener('pointerdown',()=>{try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}},{once:true});
$('test').onclick=()=>say('Hello! One, two, three.',1);$('vw').onclick=()=>{$('vw').hidden=true};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{track=b.dataset.t;$('home').hidden=true;startQuest()});
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>b.dataset.g==='quest'?startQuest():b.dataset.g==='dots'?start(track):b.dataset.g==='count'?startCount():startShapes(b.dataset.g));

big:[['circle','square','triangle'],['star','heart','circle','triangle'],['square','star','heart','triangle','circle']],hard:[['circle','square','triangle','star'],['star','heart','circle','triangle','diamond','hexagon'],['square','star','heart','triangle','circle','diamond','hexagon']]};
let rd=0,left=0,tot=0,dp=null;

$('credits').hidden=false;$('crl').style.animation='none';void $('crl').offsetWidth;$('crl').style.animation='';
clearInterval(crT);let fr=0;crT=setInterval(()=>{fr^=1;document.querySelectorAll('#crl .cs').forEach(sp=>{const im=sp.querySelector('img.px'),e=sp.dataset.e;if(im&&SPR[e])im.src=pxURL(e,fr)})},220);
}
$('cr-again').onclick=()=>{clearInterval(crT);$('credits').hidden=true;$('hud').hidden=true;startQuest()};
$('cr-home').onclick=home;
let memFirst=null,memLock=false,memLeft=0;
const MK={'🔴':'red','🔵':'blue','🟢':'green','🟡':'yellow','⭐':'star','💰':'coin'};
function loadMem(pr){
const n=track==='hard'?12:track==='big'?8:6,keys=shuf(Object.keys(MK)).slice(0,n/2),g=$('mgrid');memFirst=null;memLeft=n/2;memLock=true;
$('mq').textContent=pr||'Find the matching pairs!';g.style.gridTemplateColumns=`repeat(${n>=8?4:3},1fr)`;
g.innerHTML=shuf([...keys,...keys]).map(k=>`<button class="mc up" data-k="${k}" aria-label="card"><span class="mf">${k}</span></button>`).join('');
say((pr||'Find the pairs!')+' Remember where they are!');
setTimeout(()=>{g.querySelectorAll('.mc').forEach(c=>c.classList.remove('up'));memLock=false},track==='hard'?1800:2600);
}
$('mgrid').addEventListener('click',e=>{
const c=e.target.closest('.mc');if(!c||memLock||c.classList.contains('up'))return;
c.classList.add('up');tone(500,.08,'triangle');say(MK[c.dataset.k]);
if(!memFirst){memFirst=c;return}
const a=memFirst;memFirst=null;
if(a.dataset.k===c.dataset.k){a.classList.add('ok');c.classList.add('ok');sfx.dot();memLeft--;if(!memLeft)setTimeout(()=>{say('You found them all!');setTimeout(win,900)},500)}
else{miss();memLock=true;sfx.back();setTimeout(()=>{a.classList.remove('up');c.classList.remove('up');memLock=false},1000)}
});
$('m-home').onclick=home;
const resE=()=>qh==='👸'?'🤴':'👸',resN=()=>qh==='👸'?'prince':'princess',resP=()=>qh==='👸'?'him':'her';
const compE=()=>['🧚','🧝','🃏'].find(e=>e!==qh),CN={'🧚':'Twinkle the Fairy','🧝':'Bramble the Elf','🃏':'Jingle the Jester'};
function readWait(t){return new Promise(res=>{let d=false;const fin=()=>{if(!d){d=true;skipFn=null;res()}};skipFn=fin;setTimeout(fin,Math.max(2200,t.length*70+800))})}
function picURL(name){
const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');
const F=(col,a,b,w,h)=>{x.fillStyle=col;x.fillRect(a,b,w,h)};
F('#7FC8FF',0,0,32,32);F('#FFF',2,4,9,3);F('#FFF',4,3,5,1);F('#FFF',21,7,8,3);F('#FFF',23,6,4,1);F('#FFD23F',26,2,4,4);
const cols=['#E8484F','#FF8A3D','#FFD23F','#3FD07A','#4DA3FF','#8E5CF0'];
for(let y=0;y<27;y++)for(let a=0;a<32;a++){const d=Math.hypot(a-15.5,y-24),k=Math.floor((d-9)/1.6);if(d>=9&&k<6)F(cols[k],a,y,1,1)}
F('#4F9A64',0,26,32,6);F('#4DA3FF',5,27,22,4);F('#3FD07A',23,28,4,2);
const P={k:'#2B1D4A',w:'#FFFFFF',g:'#3FD07A',y:'#FFD23F'};
SPR['🐸'].forEach((r,j)=>[...(r+[...r].reverse().join(''))].forEach((ch,a)=>{if(P[ch])F(P[ch],8+a,13+j,1,1)}));
return c.toDataURL();
}
let PT=[],pN=3,pLeft=0,pdrag=null;
function loadPic(pr,name){
pN=track==='hard'?4:track==='big'?3:2;pLeft=pN*pN;const u=picURL(name||'rainbow');
PT=Array.from({length:pN*pN},(_,i)=>{const r=Math.floor(i/pN),c=i%pN;return `background-image:url(${u});background-size:${pN*100}% ${pN*100}%;background-position:${pN>1?c/(pN-1)*100:0}% ${pN>1?r/(pN-1)*100:0}%`});
$('pq').textContent=pr||'Put the picture back together!';
$('pgrid').style.gridTemplateColumns=`repeat(${pN},1fr)`;
$('pgrid').innerHTML=PT.map((_,i)=>`<div class="ps" data-i="${i}"></div>`).join('');
document.documentElement.style.setProperty('--pz',(pN===2?96:pN===3?76:58)+'px');
$('ptray').innerHTML=shuf(PT.map((_,i)=>i)).map(i=>`<div class="pp" data-i="${i}" style="${PT[i]}"></div>`).join('');
}
$('ptray').addEventListener('pointerdown',e=>{const p=e.target.closest('.pp');if(!p)return;p.setPointerCapture(e.pointerId);pdrag={p,x:e.clientX,y:e.clientY,m:false};p.style.zIndex=10;p.style.transition='none';tone(520,.08,'triangle')});
$('ptray').addEventListener('pointermove',e=>{if(!pdrag)return;const dx=e.clientX-pdrag.x,dy=e.clientY-pdrag.y;if(Math.abs(dx)+Math.abs(dy)>8)pdrag.m=true;pdrag.p.style.transform=`translate(${dx}px,${dy}px) scale(1.1)`});
function endPic(){
if(!pdrag)return;const{p,m}=pdrag;pdrag=null;if(!m){back(p);return}
const r=p.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
const slot=[...document.querySelectorAll('#pgrid .ps')].find(q=>{const b=q.getBoundingClientRect();return cx>b.left&&cx<b.right&&cy>b.top&&cy<b.bottom});
if(slot&&!slot.classList.contains('full')&&slot.dataset.i===p.dataset.i){slot.classList.add('full');slot.style.cssText=PT[+p.dataset.i];p.remove();sfx.dot();pLeft--;if(!pLeft)setTimeout(win,600)}
else{back(p);if(slot&&!slot.classList.contains('full'))miss();slot?sfx.back():0}
}
['pointerup','pointercancel'].forEach(t=>$('ptray').addEventListener(t,endPic));
$('p-home').onclick=home;
function autoGo(id,ov,secs){
const b=$(id),base=b.textContent.replace(/\s*\d+$/,'');let n=secs;clearInterval(b._t);b.textContent=base+' '+n;
b._t=setInterval(()=>{if(!$(ov).classList.contains('show')){clearInterval(b._t);b.textContent=base;return}
n--;if(n<=0){clearInterval(b._t);b.textContent=base;b.click()}else b.textContent=base+' '+n},1000);
}
